name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_RELEASE_TOKEN != '' && secrets.TAURI_RELEASE_TOKEN || github.token }}
        with:
          tagName: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'v') && (github.event.inputs.tag || github.ref_name) || format('v{0}', github.event.inputs.tag || github.ref_name) }}
          releaseName: 'Trae Auto v__VERSION__'
          releaseBody: |
            ## 🚀 What's New in v__VERSION__
            
            ### 📦 Installation
            Download the appropriate installer for your platform below.
            
            ### 🔗 Related Tools
            - **Automated Account Creation**: [Trae-Account-Creator](https://github.com/911218sky/Trae-Account-Creator) - Automate Trae IDE account registration
            
            ### 📋 Supported Platforms
            - ✅ Windows 10/11 (x64)
            - ✅ macOS (Intel & Apple Silicon)
            - ✅ Linux (x64)
            
            ### 📖 Documentation
            For usage instructions, visit the [README](https://github.com/911218sky/Trae-Account-Manager#readme)
            
            ---
            
            **Full Changelog**: https://github.com/911218sky/Trae-Account-Manager/commits/v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
